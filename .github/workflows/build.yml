name: Build BUILD HIM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences and install SDK 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify project ZIP
        run: |
          test -f BUILD_HIM_v1_2_FIXED_SOURCE.zip
          unzip -t BUILD_HIM_v1_2_FIXED_SOURCE.zip
          mkdir -p extracted
          unzip -q BUILD_HIM_v1_2_FIXED_SOURCE.zip -d extracted

      - name: Build debug APK
        shell: bash
        run: |
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Building project at: $PROJECT_DIR"
          gradle --version
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-HIM-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
